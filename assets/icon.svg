<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#E0384F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5A0A2A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <path d="M64 8 H192 A56 56 0 0 1 248 64 V96 Q128 136 8 96 V64 A56 56 0 0 1 64 8 Z" fill="url(#shine)"/>

  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Flecha de descarga -->
    <rect x="100" y="40" width="56" height="84" rx="12"/>
    <path d="M70 112 H186 Q196 112 189 120 L136 174 Q128 182 120 174 L67 120 Q60 112 70 112 Z"/>
    <!-- Bandeja -->
    <path d="M52 168 V194 A18 18 0 0 0 70 212 H186 A18 18 0 0 0 204 194 V168"
          fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Triángulo de "play" dentro de la flecha -->
  <path d="M117 62 L117 100 Q117 106 122 103 L145 87 Q149 83 145 79 L122 63 Q117 59 117 62 Z" fill="url(#play)"/>
</svg>
