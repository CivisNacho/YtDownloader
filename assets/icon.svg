<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Icono estilo Fluent (Windows 11): flecha de descarga en el azul de acento. -->
  <defs>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="96" y1="20" x2="160" y2="236">
      <stop offset="0" stop-color="#6CCBFF"/>
      <stop offset="0.5" stop-color="#1F8FEA"/>
      <stop offset="1" stop-color="#0052BD"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#002A5C" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Flecha (relleno + trazo del mismo color para redondear las esquinas) -->
  <g filter="url(#shadow)">
    <path d="M102 28 H154 V112 H214 L128 224 L42 112 H102 Z"
          fill="url(#arrow)" stroke="url(#arrow)" stroke-width="20" stroke-linejoin="round"/>
  </g>
</svg>
